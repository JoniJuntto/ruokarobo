<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ruokarobo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2a}
  canvas{position:fixed;inset:0;display:block}
  #ui{pointer-events:none}
  #menu{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font:600 18px system-ui;color:#e8f1fb;max-width:calc(100vw - 32px)}
  #menu[hidden]{display:none}
  #menu button,#menu input{font:inherit;border-radius:10px;border:2px solid #ff7b00;padding:10px 16px}
  #menu button{background:#ff7b00;color:#fff;cursor:pointer}
  #menu button.alt{background:#0d1b2a}
  #menu input{width:6.5em;text-transform:uppercase;text-align:center;background:#0d1b2a;color:#fff;letter-spacing:.15em}
  #status{width:100%;text-align:center;text-shadow:0 1px 3px #000}
  #shop{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font:500 14px system-ui;width:min(880px,calc(100vw - 32px))}
  #shop[hidden]{display:none}
  #shop button{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #ff7b00;background:rgba(10,22,44,.92);color:#e8f1fb;font:inherit;cursor:pointer}
  #shop button:disabled{opacity:.45;cursor:default}
  #shop button b{font-size:17px}
  #shop button span{color:#ffd84a}
  #shop #bNext{grid-column:1/-1;align-items:center;background:#ff7b00;color:#fff;font-weight:700;font-size:18px}
  #menu #bStart{font-weight:800;padding:10px 28px;background:#2fbf6a;border-color:#2fbf6a}
  #menu.over > :not(#bStart){display:none}
  #bStart[hidden],#touch[hidden]{display:none}
  #stick{position:fixed;left:20px;bottom:84px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none}
  .tbtn{position:fixed;width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,255,255,.6);color:#fff;font:800 14px system-ui;touch-action:none}
  #tBoost{right:20px;bottom:180px;background:rgba(79,216,255,.55)}
  #tBrake{right:20px;bottom:84px;background:rgba(255,123,0,.55)}
</style>
</head>
<body>
<canvas id="ui"></canvas>
<div id="menu">
  <button id="bStart" hidden>▶ Start</button>
  <button id="bHost">🌐 Host online game</button>
  <span id="joinBox"><input id="code" placeholder="CODE" maxlength="5" autocomplete="off"> <button id="bJoin" class="alt">Join</button></span>
  <div id="status"></div>
</div>
<div id="shop" hidden></div>
<div id="touch" hidden><div id="stick"><div id="knob"></div></div><button id="tBoost" class="tbtn">BOOST</button><button id="tBrake" class="tbtn">BRAKE</button></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// Simulation runs on a flat 1600x900 map (px). Rendering maps px → 3D units.
const W = 1600, H = 900, R = 7, S = .1, OX = W * S / 2, OZ = H * S / 2;
const inR = (x, y, p) => x >= p[0] && x <= p[0] + p[2] && y >= p[1] && y <= p[1] + p[3];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];

// ---------- map ----------
const PATHS = [[0, 560, W, 40], [0, 720, W, 40], [620, 256, 40, 304], [400, 220, 950, 36], [1300, 256, 40, 304]];
const ROAD = [0, 600, W, 120];
const CROSS = [[620, 600, 40, 120], [1300, 600, 40, 120]];
const LAKE = { x: 980, y: 400, rx: 210, ry: 95 };
const ALEPA = { x: 30, y: 330, w: 190, h: 200, door: { x: 125, y: 552 } };
const SAUNA = { x: 1205, y: 420, w: 70, h: 50 };
const HOUSES = [
  { x: 420, y: 90, w: 150, h: 110, door: { x: 495, y: 222 }, wall: '#b3261e' },
  { x: 780, y: 80, w: 160, h: 120, door: { x: 860, y: 222 }, wall: '#b3261e' },
  { x: 1120, y: 90, w: 150, h: 110, door: { x: 1195, y: 222 }, wall: '#e2b13c' },
  { x: 1390, y: 300, w: 170, h: 220, door: { x: 1475, y: 552 }, tall: true },
  { x: 250, y: 790, w: 160, h: 90, door: { x: 330, y: 776 }, wall: '#b3261e' },
  { x: 760, y: 790, w: 160, h: 90, door: { x: 840, y: 776 }, wall: '#3d6e9e' },
  { x: 1250, y: 790, w: 160, h: 90, door: { x: 1330, y: 776 }, wall: '#b3261e' },
];
HOUSES.forEach((h, i) => h.n = i + 1);
const SOLIDS = [ALEPA, SAUNA, ...HOUSES];
const DOORS = [ALEPA.door, ...HOUSES.map(h => h.door)];
const LAMPS = [];
for (const x of [180, 450, 760, 1060, 1420]) LAMPS.push({ x, y: 548 }, { x: x + 60, y: 772 });
for (const x of [470, 760, 1040, 1260]) LAMPS.push({ x, y: 270 });
const inLake = (x, y, m = 0) => ((x - LAKE.x) / (LAKE.rx + m)) ** 2 + ((y - LAKE.y) / (LAKE.ry + m)) ** 2 < 1;

const trees = [{ x: 300, y: 150, r: 5, kind: 'flag' }];
function freeAt(x, y, m) {
  if (x < m || y < m || x > W - m || y > H - m) return false;
  for (const p of [...PATHS, ROAD]) if (x > p[0] - m && x < p[0] + p[2] + m && y > p[1] - m && y < p[1] + p[3] + m) return false;
  for (const b of SOLIDS) if (x > b.x - m && x < b.x + b.w + m && y > b.y - m && y < b.y + b.h + m) return false;
  if (inLake(x, y, m)) return false;
  if (DOORS.some(d => Math.hypot(d.x - x, d.y - y) < 70)) return false;
  return !trees.some(t => Math.hypot(t.x - x, t.y - y) < m * 2);
}
for (let tries = 0; trees.length < 45 && tries < 4000; tries++) {
  const x = rnd(0, W), y = rnd(0, H);
  if (freeAt(x, y, 24)) {
    const kind = trees.length < 4 ? 'snowman' : Math.random() < .55 ? 'spruce' : 'birch';
    trees.push({ x, y, kind, r: { spruce: 15, birch: 10, snowman: 13 }[kind] });
  }
}

// ponytail: feel knobs. terminal speed ≈ acc/kF, kL = sideways grip
const SURF = {
  // winter: everything slides. Packed-snow sidewalks drift, fresh snow grips a bit more, ice barely at all
  path: { acc: 420, kF: 1.1, kL: 2.2, max: 190 },
  snow: { acc: 380, kF: 2.6, kL: 3.5, max: 120 },
  ice:  { acc: 110, kF: 0.12, kL: 0.18, max: 270 },
};
let ice = [], holes = [], cars = [], peds = [], kids = [], balls = [], plow = null;
let weather = { k: null, t: 0 }, weatherIn = Infinity;
function surf(x, y) { // surface feel with upgrades applied
  const s = SURF[surface(x, y)];
  const grip = up.tires * (s === SURF.ice ? .9 : 1.4);
  if (s === SURF.ice) return { ice: true, acc: s.acc + up.tires * 60, kF: s.kF + up.tires * .3, kL: s.kL + grip, max: s.max };
  return { acc: s.acc * (1 + .12 * up.motor), kF: s.kF, kL: s.kL + grip, max: s.max * (1 + .1 * up.motor) };
}
function surface(x, y) {
  if (weather.k === 'freeze') return 'ice'; // freezing rain glazes everything
  for (const p of ice) if (!p.gone && ((x - p.x) / p.rx) ** 2 + ((y - p.y) / p.ry) ** 2 < 1) return 'ice';
  if (inLake(x, y)) return 'ice';
  if (inR(x, y, ROAD)) return 'path';
  for (const p of PATHS) if (inR(x, y, p)) return 'path';
  return 'snow';
}

// ---------- three.js setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#cfdbe8', 60, 220);
renderer.shadowMap.autoUpdate = false; // updated once per frame, not once per split-screen view
const camera = new THREE.PerspectiveCamera(45, 1, 1, 700);
const ui = document.getElementById('ui'), ctx = ui.getContext('2d');
let vw = 0, vh = 0;
function resize() {
  vw = innerWidth; vh = innerHeight;
  renderer.setSize(vw, vh); camera.aspect = vw / vh; camera.updateProjectionMatrix();
  const d = devicePixelRatio || 1;
  ui.width = vw * d; ui.height = vh * d; ui.style.width = vw + 'px'; ui.style.height = vh + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight('#e4eefa', '#ffffff', 2);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1dc', 2.5);
sun.position.set(-60, 90, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -100, right: 100, top: 70, bottom: -70, near: 10, far: 300 });
sun.shadow.bias = -.0005; sun.shadow.normalBias = .05;
scene.add(sun);

const _g = {}, _m = {};
const boxGeo = (w, h, d) => _g[`b${w},${h},${d}`] ??= new THREE.BoxGeometry(w, h, d);
const cylGeo = (a, b, h, n = 10) => _g[`c${a},${b},${h},${n}`] ??= new THREE.CylinderGeometry(a, b, h, n);
const coneGeo = (r, h) => _g[`k${r},${h}`] ??= new THREE.ConeGeometry(r, h, 9);
const sphGeo = r => _g[`s${r}`] ??= new THREE.SphereGeometry(r, 14, 10);
const mat = (c, e) => _m[c + (e || '')] ??= new THREE.MeshLambertMaterial(e ? { color: c, emissive: e, emissiveIntensity: .8 } : { color: c });
function mesh(geo, m, parent, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(geo, typeof m === 'string' ? mat(m) : m);
  o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o;
}
const box = (p, w, h, d, c, x, y, z) => mesh(boxGeo(w, h, d), c, p, x, y, z);
const place = (o, x, y, h = 0) => (o.position.set(x * S - OX, h, y * S - OZ), o);
const group = (x, y, parent = scene) => { const g = place(new THREE.Group(), x, y); parent.add(g); return g; };
function flat(geo, m, x, y, h, sx = 1, sz = 1, parent = scene) {
  const o = new THREE.Mesh(geo, m); o.rotation.x = -Math.PI / 2; o.scale.set(sx, sz, 1);
  place(o, x, y, h); o.receiveShadow = true; parent.add(o); return o;
}
const rect = (p, color, h) => flat(new THREE.PlaneGeometry(p[2] * S, p[3] * S), mat(color), p[0] + p[2] / 2, p[1] + p[3] / 2, h);
function tex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function prism(width, height, length) { // gable roof, ridge along X
  const s = new THREE.Shape(); s.moveTo(-width / 2, 0); s.lineTo(width / 2, 0); s.lineTo(0, height); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: length, bevelEnabled: false });
  g.translate(0, 0, -length / 2); g.rotateY(Math.PI / 2); return g;
}
const glass = new THREE.MeshLambertMaterial({ color: '#ffd877', emissive: '#ffb84a', emissiveIntensity: .7 });
function plateMesh(n) {
  const t = tex(64, 48, (g) => { g.fillStyle = '#1f4e9c'; g.fillRect(0, 0, 64, 48); g.fillStyle = '#fff'; g.font = 'bold 34px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(n, 32, 26); });
  return new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.05), new THREE.MeshLambertMaterial({ map: t, emissive: '#fff', emissiveMap: t, emissiveIntensity: .3 }));
}

const FI_TEX = tex(180, 110, (c) => { c.fillStyle = '#fff'; c.fillRect(0, 0, 180, 110); c.fillStyle = '#003580'; c.fillRect(50, 0, 30, 110); c.fillRect(0, 40, 180, 30); });

// ---------- static scene ----------
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 400), mat('#eef3f8'));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  for (let i = 0; i < 40; i++) { // snowdrifts
    const x = rnd(0, W), y = rnd(0, H);
    if (!freeAt(x, y, 30)) continue;
    const d = mesh(sphGeo(1), '#f7fafc', scene); place(d, x, y, 0); d.scale.set(rnd(2, 5), rnd(.5, 1.1), rnd(1.5, 3)); d.rotation.y = rnd(0, 3);
  }
  const lake = new THREE.MeshPhongMaterial({ color: '#a9d4ee', shininess: 90, specular: '#ffffff' });
  flat(new THREE.CircleGeometry(1, 48), lake, LAKE.x, LAKE.y, .025, LAKE.rx * S, LAKE.ry * S);
  box(scene, 6.6, .3, 1.6, '#8a5a33', 1173 * S - OX, .2, 446 * S - OZ); // pier
  rect(ROAD, '#4d525a', .02);
  for (const p of PATHS) rect(p, '#c4cad3', .03);
  for (let x = 10; x < W; x += 60) rect([x, 658, 32, 4], '#e9c84a', .045);
  for (const c of CROSS) for (let y = c[1] + 6; y < c[1] + c[3] - 4; y += 16) rect([c[0], y, c[2], 9], '#f2f2f2', .045);
  for (const d of DOORS) rect([d.x - 18, d.y - 8, 36, 16], d === ALEPA.door ? '#2f7d4a' : '#7a5230', .05);
}
const lampLights = LAMPS.map(l => {
  const g = group(l.x, l.y);
  mesh(cylGeo(.15, .2, 6.5, 8), '#2b2f36', g, 0, 3.25, 0);
  mesh(sphGeo(.45), mat('#fff3c4', '#ffd877'), g, 0, 6.6, 0);
  const pl = new THREE.PointLight('#ffd9a0', 0, 28, 1); pl.position.y = 6.2; g.add(pl); return pl;
});
function buildHouse(b) {
  const g = group(b.x + b.w / 2, b.y + b.h / 2), w = b.w * S, d = b.h * S, wh = 5, rh = 3.6;
  const s = b.door.y > b.y + b.h / 2 ? 1 : -1, fz = s * d / 2;
  box(g, w, wh, d, b.wall, 0, wh / 2, 0);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(g, .5, wh, .5, '#ffffff', sx * w / 2, wh / 2, sz * d / 2);
  mesh(prism(d + 1.4, rh, w + 1.4), '#3b3f47', g, 0, wh, 0);
  mesh(prism(d + 1.2, rh * .94, w + 1.2), '#fbfdff', g, 0, wh + .3, 0);
  box(g, 1, 2.6, 1, '#7d3b2a', w * .25, wh + rh * .55, -s * d * .15);
  for (const side of [1, -1]) for (const fx of [-.3, .3]) {
    box(g, 2.6, 2.6, .12, '#ffffff', w * fx, wh * .55, side * (d / 2 + .02));
    mesh(boxGeo(2.1, 2.1, .16), glass, g, w * fx, wh * .55, side * (d / 2 + .03));
  }
  const dx = (b.door.x - b.x - b.w / 2) * S;
  box(g, 1.6, 3, .2, '#5b3a1e', dx, 1.5, fz + s * .1);
  const p = plateMesh(b.n); p.position.set(dx + 1.6, 3.4, fz + s * .12); if (s < 0) p.rotation.y = Math.PI; g.add(p);
}
function buildBlock(b) {
  const g = group(b.x + b.w / 2, b.y + b.h / 2), w = b.w * S, d = b.h * S, hh = 16;
  const facade = tex(256, 256, (c) => {
    c.fillStyle = '#d9cbb0'; c.fillRect(0, 0, 256, 256);
    for (let r = 0; r < 5; r++) for (let k = 0; k < 4; k++) {
      c.fillStyle = Math.random() < .65 ? '#ffd877' : '#4b5563'; c.fillRect(20 + k * 60, 16 + r * 50, 34, 30);
      c.fillStyle = '#b8a888'; c.fillRect(14 + k * 60, 46 + r * 50, 46, 5);
    }
  });
  const fm = new THREE.MeshLambertMaterial({ map: facade, emissive: '#fff', emissiveMap: facade, emissiveIntensity: .25 });
  const o = mesh(boxGeo(w, hh, d), [fm, fm, mat('#fbfdff'), fm, fm, fm], g, 0, hh / 2, 0);
  box(g, 2.4, 3, .2, '#5b3a1e', (b.door.x - b.x - b.w / 2) * S, 1.5, d / 2 + .1);
  const p = plateMesh(b.n); p.position.set((b.door.x - b.x - b.w / 2) * S + 2.2, 3.6, d / 2 + .12); g.add(p);
}
function buildAlepa() {
  const b = ALEPA, g = group(b.x + b.w / 2, b.y + b.h / 2), w = b.w * S, d = b.h * S, hh = 7;
  const front = tex(512, 192, (c) => {
    c.fillStyle = '#2b2f36'; c.fillRect(0, 0, 512, 192);
    c.fillStyle = '#e8501f'; c.fillRect(0, 0, 512, 72);
    c.fillStyle = '#fff'; c.font = '900 58px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('ALEPA', 256, 38);
    c.fillStyle = '#fff3c4'; c.fillRect(20, 92, 170, 90); c.fillRect(322, 92, 170, 90);
    c.fillStyle = '#9fd3ff'; c.fillRect(216, 88, 80, 104);
  });
  const fm = new THREE.MeshLambertMaterial({ map: front, emissive: '#fff', emissiveMap: front, emissiveIntensity: .45 });
  const wall = mat('#8a929c');
  mesh(boxGeo(w, hh, d), [wall, wall, mat('#fbfdff'), wall, fm, wall], g, 0, hh / 2, 0);
  box(g, 3, 1.2, 2, '#9aa3ad', -4, hh + .6, -3); box(g, 4, 1.4, 3, '#9aa3ad', 4, hh + .7, 2);
}
const smokeFrom = { x: 0, y: 0, h: 0 };
function buildSauna() {
  const b = SAUNA, g = group(b.x + b.w / 2, b.y + b.h / 2), w = b.w * S, d = b.h * S;
  box(g, w, 3.2, d, '#6b4226', 0, 1.6, 0);
  for (let y = .4; y < 3.2; y += .55) box(g, w + .1, .12, d + .1, '#4e2f1a', 0, y, 0);
  mesh(prism(d + 1, 2, w + 1), '#2f2a26', g, 0, 3.2, 0);
  mesh(prism(d + .8, 1.85, w + .8), '#fbfdff', g, 0, 3.4, 0);
  box(g, .9, 2.4, .9, '#555', w * .3, 4.2, 0);
  Object.assign(smokeFrom, { x: b.x + b.w / 2 + w * .3 / S, y: b.y + b.h / 2, h: 5.6 });
}
let flagMesh;
function buildTree(t) {
  const g = group(t.x, t.y); g.rotation.y = rnd(0, 6);
  if (t.kind === 'spruce') {
    g.scale.setScalar(rnd(.8, 1.25));
    mesh(cylGeo(.4, .5, 2, 6), '#5a3d2b', g, 0, 1, 0);
    for (const [r, h, y] of [[3.2, 4.5, 1.8], [2.5, 4, 4.3], [1.7, 3.4, 6.6]]) {
      mesh(coneGeo(r, h), '#1f4d34', g, 0, y + h / 2, 0);
      mesh(coneGeo(r * .55, h * .52), '#f4f8fb', g, 0, y + h * .76, 0);
    }
  } else if (t.kind === 'birch') {
    const hgt = rnd(8, 10);
    mesh(cylGeo(.28, .38, hgt, 8), '#f2f1ea', g, 0, hgt / 2, 0);
    for (let i = 0; i < 6; i++) { const m = box(g, .7, .14, .3, '#222', 0, rnd(1, hgt - 1), 0); m.rotation.y = rnd(0, 6); }
    for (let i = 0; i < 6; i++) {
      const p = new THREE.Group(); p.position.y = rnd(hgt * .5, hgt * .85); p.rotation.set(0, rnd(0, 6), rnd(.5, .9)); g.add(p);
      mesh(cylGeo(.05, .1, 4, 5), '#7a6a5a', p, 0, 2, 0);
    }
    const crown = mesh(sphGeo(3), new THREE.MeshLambertMaterial({ color: '#8a7a6a', transparent: true, opacity: .28 }), g, 0, hgt, 0);
    crown.castShadow = false;
  } else if (t.kind === 'snowman') {
    for (const [r, y] of [[1.4, 1.2], [1, 3.1], [.72, 4.5]]) mesh(sphGeo(r), '#ffffff', g, 0, y, 0);
    const n = mesh(coneGeo(.15, .9), '#f08a24', g, .95, 4.5, 0); n.rotation.z = -Math.PI / 2;
    mesh(sphGeo(.1), '#111', g, .62, 4.75, .25); mesh(sphGeo(.1), '#111', g, .62, 4.75, -.25);
    box(g, .7, .7, .7, '#222', 0, 5.3, 0);
    const sc = mesh(new THREE.TorusGeometry(.75, .2, 6, 16), '#d33', g, 0, 3.9, 0); sc.rotation.x = Math.PI / 2;
  } else {
    mesh(cylGeo(.1, .14, 10, 8), '#f0f0f0', g, 0, 5, 0);
    const ft = FI_TEX;
    const fp = new THREE.Group(); fp.position.y = 8.9; g.add(fp);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.2), new THREE.MeshLambertMaterial({ map: ft, side: THREE.DoubleSide }));
    f.position.x = 1.85; f.castShadow = true; fp.add(f); flagMesh = fp;
  }

    ctx.fillStyle = 'rgba(10,22,44,.8)'; ctx.beginPath(); ctx.roundRect(v.x + v.w / 2 - tw / 2, v.y + v.h - 46, tw, 34, 10); ctx.fill();
    ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(v.x + v.w / 2 - tw / 2 + 18, v.y + v.h - 29, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8f1fb'; ctx.fillText(txt, v.x + v.w / 2 + 10, v.y + v.h - 28);
    const bw = 120, bx = v.x + v.w / 2 - bw / 2, by = v.y + v.h - 58;
    ctx.fillStyle = 'rgba(10,22,44,.8)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 10);
    ctx.fillStyle = r.boost > .02 ? '#4fd8ff' : '#556'; ctx.fillRect(bx, by, bw * r.boost, 6);
    ctx.font = 'bold 11px system-ui'; ctx.fillStyle = '#4fd8ff'; ctx.textAlign = 'right'; ctx.fillText('BOOST', bx - 6, by + 3); ctx.textAlign = 'center';
    drawMinimap(v);
  }
  for (const p of [...peds, ...kids]) {
    const q = scr(p.x, p.y, p.dx != null ? 2.4 : 3.3, v);
    if (!q.ok) continue;
    const txt = p.sayT > 0 ? p.say : p.mode === 'chase' ? '💢' : '';
    if (!txt) continue;
    ctx.font = 'bold 14px system-ui'; const tw = ctx.measureText(txt).width + 14;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#d33'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(q.x - tw / 2, q.y - 12, tw, 24, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a1010'; ctx.fillText(txt, q.x, q.y + 1);

    ctx.font = 'bold 13px system-ui'; ctx.fillStyle = r.color; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 3;
    ctx.strokeText('P' + (r.i + 1), p.x, p.y + 22); ctx.fillText('P' + (r.i + 1), p.x, p.y + 22);

      ctx.fillStyle = `hsl(${r.cargo.cond * 120},80%,45%)`; ctx.fillRect(top.x - 20, y - 4, 40 * r.cargo.cond, 8);
      ctx.font = '14px system-ui'; ctx.fillText(ORDERS[r.cargo.o].icon, top.x - 32, y);
      y -= 12;
    }
    if (r.hole) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(p.x - 22, p.y + 32, 44, 6);
      ctx.fillStyle = '#ffd84a'; ctx.fillRect(p.x - 22, p.y + 32, 44 * r.esc, 6);
    }
    if (r.sayT > 0) {
      ctx.font = 'bold 15px system-ui';
      const tw = ctx.measureText(r.say).width + 16; y -= 18;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = r.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(top.x - tw / 2, y - 13, tw, 26, 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1b2533'; ctx.fillText(r.say, top.x, y + 1);

  }
  for (const f of floats) {

    ctx.font = '800 24px system-ui'; ctx.fillStyle = f.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;

}
const miniBg = document.createElement('canvas'); miniBg.width = 480; miniBg.height = 270;
{
  const g = miniBg.getContext('2d'); g.scale(480 / W, 270 / H);
  g.fillStyle = '#e8eff6'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#b9dcf0'; g.beginPath(); g.ellipse(LAKE.x, LAKE.y, LAKE.rx, LAKE.ry, 0, 0, 7); g.fill();
  g.fillStyle = '#50555d'; g.fillRect(...ROAD);
  g.fillStyle = '#b3bac4'; PATHS.forEach(p => g.fillRect(...p));
  g.fillStyle = '#2f9e57'; g.fillRect(ALEPA.x, ALEPA.y, ALEPA.w, ALEPA.h);
  g.fillStyle = '#6b4226'; g.fillRect(SAUNA.x, SAUNA.y, SAUNA.w, SAUNA.h);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 70px system-ui';
  for (const h of HOUSES) { g.fillStyle = h.tall ? '#9a8e78' : h.wall; g.fillRect(h.x, h.y, h.w, h.h); g.fillStyle = '#fff'; g.fillText(h.n, h.x + h.w / 2, h.y + h.h / 2); }
  g.fillStyle = '#fff'; g.fillText('A', ALEPA.x + ALEPA.w / 2, ALEPA.y + ALEPA.h / 2);
}
function drawMinimap(v) {
  const mw = Math.min(240, v.w * .3), mh = mw * H / W, x = v.x + v.w - mw - 12, y = v.y + (v.y < 1 ? 58 : 12), k = mw / W;
  ctx.save();
  ctx.globalAlpha = .92; ctx.drawImage(miniBg, x, y, mw, mh); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.rect(x, y, mw, mh); ctx.clip();
  const dot = (px, py, rad, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + px * k, y + py * k, rad, 0, 7); ctx.fill(); };
  ctx.fillStyle = 'rgba(150,210,245,.95)';
  for (const p of ice) if (!p.gone) { ctx.beginPath(); ctx.ellipse(x + p.x * k, y + p.y * k, p.rx * k, p.ry * k, 0, 0, 7); ctx.fill(); }
  for (const h of holes) dot(h.x, h.y, 2.2, '#111');
  for (const c of cars) { ctx.fillStyle = '#26303b'; ctx.fillRect(x + (c.x - 40) * k, y + (c.y - 18) * k, 80 * k, 36 * k); }
  const tgt = v.r.cargo ? HOUSES[v.r.cargo.dest].door : ALEPA.door;
  ctx.strokeStyle = v.r.color; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x + tgt.x * k, y + tgt.y * k, 7 + Math.sin(T * 6) * 2, 0, 7); ctx.stroke();
  for (const p of peds) dot(p.x, p.y, 2.5, p.mode === 'chase' ? '#ff3b30' : p.kind === 'dog' ? '#8b5a2b' : '#556');
  for (const q of kids) dot(q.x, q.y, 2.2, '#ff9d00');
  if (plow) { ctx.fillStyle = '#f5a200'; ctx.fillRect(x + plow.x * k - 4, y + plow.y * k - 4, 8, 8); }
  for (const r of robots) {
    ctx.save(); ctx.translate(x + r.x * k, y + r.y * k); ctx.rotate(r.a);
    const sz = r === v.r ? 6 : 4.5;
    ctx.fillStyle = r.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = r === v.r ? 1.5 : 0;
    ctx.beginPath(); ctx.moveTo(sz, 0); ctx.lineTo(-sz * .7, -sz * .7); ctx.lineTo(-sz * .7, sz * .7); ctx.closePath(); ctx.fill(); if (r === v.r) ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(10,22,44,.9)'; ctx.lineWidth = 3; ctx.strokeRect(x, y, mw, mh);
}
function drawHUD() {
  if (state !== 'title') {
    ctx.font = '600 20px system-ui'; ctx.textAlign = 'left';
    const wxTag = weather.k === 'blizzard' ? '   ❄️ Blizzard' : weather.k === 'freeze' ? '   🧊 Freezing rain' : '';
    const txt = `Shift ${level}   🔋 ${Math.ceil(time)}s   📦 ${delivered}/${quota}   💶 ${money} €${wxTag}${roomCode ? `   🌐 ${roomCode}` : ''}`;
    ctx.fillStyle = 'rgba(10,22,44,.8)'; ctx.beginPath(); ctx.roundRect(14, 12, ctx.measureText(txt).width + 32, 42, 10); ctx.fill();
    ctx.fillStyle = time < 10 && state === 'play' && T % 1 < .5 ? '#ff6b6b' : '#e8f1fb';
    ctx.fillText(txt, 30, 34);
  }
  if (state === 'play' && robots.length < 8 && vw > 900) {
    const free = KB.filter((k, i) => !myCtrls().some(c => c.kb === i)).map(k => k.name);
    const txt = `Friends join: ${[...free, 'gamepad'].join(' / ')}`;
    ctx.font = '600 15px system-ui'; ctx.textAlign = 'right';
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(10,22,44,.75)'; ctx.beginPath(); ctx.roundRect(vw - tw - 38, 14, tw + 24, 32, 8); ctx.fill();
    ctx.fillStyle = '#e8f1fb'; ctx.fillText(txt, vw - 26, 31);
  }
  if (wxMsgT > 0 && state === 'play') {
    ctx.font = '900 34px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,22,44,.9)'; ctx.fillStyle = '#9fe3ff';
    ctx.strokeText(wxMsg, vw / 2, vh * .2); ctx.fillText(wxMsg, vw / 2, vh * .2);
  }
  if (bannerT > 0 && state === 'play') panel([[banner, 34, '#ffd84a'], [`Deliver ${quota} orders before the battery runs out`, 20], ['Fast + careful = bigger tips', 18, '#b8c6d6']], vh * .3);
  if (state === 'title') {
    panel([
      ['RUOKAROBO', 64, '#ff7b00'], ['', 10],
      ['Deliver groceries from Alepa. Earn tips, upgrade your robots, survive the winter.', 20],
      ['Stuck in a pothole? A friend can tow you out. Park next to a friend to hand over a package.', 20],
      ['Watch out for angry locals, dogs, snowball kids, the snowplow and sudden weather!', 18, '#b8c6d6'], ['', 10],
      ['Join: WASD · Arrows · IJKL · TFGH · or any gamepad button', 22, '#9fd3ff'],
      ['Up/down = drive, left/right = turn', 18, '#b8c6d6'],
      ['Boost: L-Shift · R-Shift · U · R    Handbrake: Space · . · O · Y    Pad: A boost, B handbrake', 16, '#b8c6d6'], ['', 10],
      [robots.length ? `Players: ${robots.map(r => 'P' + (r.i + 1)).join('  ')}` : 'No players yet', 22, '#2fbf6a'],
      role === 'guest' ? ['Waiting for the host to start…', 24, '#ffd84a'] : ['Press ENTER (or gamepad A/Start) to start', 24, '#ffd84a'],
      [`${best ? `Best: ${best} €   ·   ` : ''}M = music on/off`, 18, '#b8c6d6'],
    ], Math.max(10, vh * .06));
  } else if (state === 'shop') {
    panel([[`Shift ${level} done! 🎉`, 40, '#2fbf6a'], [`Battery left: +${bonus} €   ·   Team money: ${money} €`, 24],
           ['Upgrades and robot style (click or press 1–8)', 20, '#b8c6d6']], Math.max(10, vh * .06));
  } else if (state === 'over') {
    panel([['Battery dead — quota missed! 🪫', 40, '#ff6b6b'], [`You reached shift ${level} and earned ${score} € in total`, 24],
           [`Best run: ${best} €`, 20, '#b8c6d6'], [role === 'guest' ? 'Waiting for the host…' : 'ENTER / Start to try again', 22, '#ffd84a']]);
  }
}

// ---------- upgrade shop (DOM so everyone can click) ----------
const shopEl = document.getElementById('shop');
for (const u of SHOP) {
  const b = document.createElement('button'); b.dataset.k = u.k; b.onclick = () => buy(u.k); shopEl.append(b);
}
const nextBtn = document.createElement('button'); nextBtn.id = 'bNext'; nextBtn.onclick = pressStart; shopEl.append(nextBtn);
let shopKey = '';
function renderShop() {
  shopEl.hidden = state !== 'shop';
  const key = JSON.stringify([state, money, up, role]);
  if (state !== 'shop' || key === shopKey) return;
  shopKey = key;
  for (const b of shopEl.querySelectorAll('button[data-k]')) {
    const u = SHOP.find(u => u.k === b.dataset.k), lv = up[u.k];
    if (u.price) { // cosmetic: buy once
      b.disabled = lv >= 1 || money < u.price;
      b.innerHTML = `<b>[${u.key}] ${u.name}</b><small>${u.desc}</small><span>${lv ? 'Owned ✓' : u.price + ' €'}</span>`;
    } else {
      b.disabled = lv >= 3 || money < PRICES[lv];
      b.innerHTML = `<b>[${u.key}] ${u.name}</b><small>${u.desc}</small><span>${'●'.repeat(lv)}${'○'.repeat(3 - lv)} · ${lv >= 3 ? 'MAX' : PRICES[lv] + ' €'}</span>`;
    }
  }
  nextBtn.disabled = role === 'guest';
  nextBtn.textContent = role === 'guest' ? 'Waiting for the host to start the next shift…' : 'Start next shift ▶  (Enter)';

// ---------- touch controls ----------
const $ = id => document.getElementById(id);
const touchDev = matchMedia('(pointer: coarse)').matches;
const touchIn = { t: 0, s: 0, b: false, h: false };
const stick = $('stick'), knob = $('knob');
const joinTouch = () => { if (!myCtrls().some(c => c.touch)) join({ touch: 1 }); };
function moveStick(e) {
  const b = stick.getBoundingClientRect(), rad = b.width / 2 - 20;
  let dx = e.clientX - b.left - b.width / 2, dy = e.clientY - b.top - b.height / 2;
  const l = Math.hypot(dx, dy); if (l > rad) { dx *= rad / l; dy *= rad / l; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const dz = v => Math.abs(v) < .15 ? 0 : v;
  touchIn.s = dz(dx / rad); touchIn.t = dz(-dy / rad);

let stickId = null; // follow the finger that grabbed the stick
stick.onpointerdown = e => { stickId = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (_) {} joinTouch(); moveStick(e); };
stick.onpointermove = e => { if (e.pointerId === stickId) moveStick(e); };

for (const [id, k] of [['tBoost', 'b'], ['tBrake', 'h']]) {
  const el = $(id);
  el.onpointerdown = e => { try { el.setPointerCapture(e.pointerId); } catch (_) {} joinTouch(); touchIn[k] = true; };
  el.onpointerup = el.onpointercancel = () => { touchIn[k] = false; };

$('bStart').onclick = pressStart;

// ---------- music: an original little polka loop, M toggles ----------
let musicOn = true, musicNext = 0, musicStep = 0;
const MEL = [12, 15, 19, 15, 17, 15, 12, null, 12, 15, 19, 22, 24, 22, 19, null, 19, 17, 15, 17, 19, null, 15, 12, 10, 12, 15, 12, 7, null, 12, null];
const BASS = [0, 0, -4, -4, -2, -2, 0, 0];
function musicTick() {
  if (!ac || !musicOn || ac.state !== 'running') return;
  if (musicNext < ac.currentTime) musicNext = ac.currentTime + .05;
  while (musicNext < ac.currentTime + .25) {
    const st = musicStep++ % MEL.length, n = MEL[st];
    if (n != null) tone(220 * 2 ** (n / 12), .2, musicNext, 'triangle', .018);
    if (st % 4 === 0) tone(55 * 2 ** (BASS[st / 4 % BASS.length] / 12), .6, musicNext, 'sine', .05);
    musicNext += .19;
  }
}

// ---------- go ----------
setupLevel(1);
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); sync(dt);
  const vs = views();
  renderer.shadowMap.needsUpdate = true;
  renderer.setScissorTest(true);
  for (const v of vs) {
    v.cam.aspect = v.w / v.h; v.cam.updateProjectionMatrix();
    renderer.setViewport(v.x, vh - v.y - v.h, v.w, v.h); renderer.setScissor(v.x, vh - v.y - v.h, v.w, v.h);

  renderShop();

  $('touch').hidden = !touchDev || !(state === 'play' || state === 'title');
