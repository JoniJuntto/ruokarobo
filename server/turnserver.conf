# coturn: relays the game's WebRTC traffic for players who can't connect directly (CGNAT,
# symmetric NAT, strict firewalls). Installed to /etc/turnserver.conf by deploy.sh.
# Firewall must allow 3478 tcp+udp and the relay range below over udp.
listening-port=3478
realm=ruokarobo.com
fingerprint
lt-cred-mech
user=ruokarobo:ruokarobo-relay
min-port=49160
max-port=49260
no-tls
no-dtls
no-cli
no-multicast-peers
stale-nonce
syslog

# Shared box: never relay into private/local networks, and cap what one user can use.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
user-quota=12
total-quota=100
max-bps=500000
